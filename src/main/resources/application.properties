spring.application.name=multifosforos

# HTTPS con un certificado propio (autofirmado), para que los celulares puedan entrar
# aunque Safari/Chrome bloqueen las páginas "http". La primera vez el navegador avisa
# que la conexión no es privada: hay que tocar "Visitar sitio igualmente".
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=multifosforos
server.ssl.key-alias=multifosforos
